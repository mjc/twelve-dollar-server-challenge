[package]
name = "twelve-dollar-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

[dependencies]
axum = "=0.8.9"
bytes = "=1.12.1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
tokio = { version = "=1.53.2", features = ["macros", "net", "rt", "signal", "sync", "time"] }

[dev-dependencies]
divan = "=0.1.21"
gungraun = { version = "=0.20.0", features = ["act"] }
http-body-util = "=0.1.5"
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }

[profile.bench]
debug = 2
strip = false

[profile.release]
debug = false          # No debug symbols for smaller binaries
strip = true           # Strip symbols for even smaller size
lto = "fat"            # Optimize across the entire program
codegen-units = 1      # Single codegen unit for better optimization
overflow-checks = true # Keep overflow checks for safety with untrusted network data

[profile.profiling]
inherits = "release"
debug = 2              # Full DWARF debuginfo for accurate flamegraphs
strip = false
