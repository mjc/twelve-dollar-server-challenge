[package]
name = "feed-load"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
goose = { version = "=0.18.1", default-features = false }
gumdrop = "0.8"
libc = "0.2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls-manual-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
tower = "0.5"
webpki-roots = "1"

[patch.crates-io]
hyper-util = { path = "vendor/hyper-util" }
